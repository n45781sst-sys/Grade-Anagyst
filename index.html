<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>محلل درجات الطالب</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; background-color: 
#f4f6fa; }
.analyzer-box { background: #fff; padding: 20px; border-radius: 8px; max￾width: 400px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
input, button { width: 100%; margin-bottom: 10px; padding: 8px; box￾sizing: border-box; }
button { background-color: #1f4e9c; color: white; border: none; cursor: 
pointer; }
.report { margin-top: 15px; padding: 15px; background: #eef2f9; border￾radius: 5px; display: none; }
</style>
</head>
<body>
<div class="analyzer-box">
<h3>محلل درجات الطالب</h3>
<label>الدرجه الاولي:</label>
<input type="number" id="grade1" placeholder="85 :مثال">
<label>الدرجه الثانيه:</label>
<input type="number" id="grade2" placeholder="90 :مثال">
<label>الدرجه الثالثه:</label>
<input type="number" id="grade3" placeholder="75 :مثال">
<label>نسبه الحضور(%):</label>
<input type="number" id="attendance" placeholder="80 :مثال">
<button id="analyzeBtn">النتيجة تحليل</button>
<!--منطقة عرض التقرير -->
<div id="reportBox" class="report"></div>
</div>
<script>
 // ثوابت قواعد العمل .1
const PASS_MARK = 50;
const MIN_ATTENDANCE = 75;
 //دالة لحساب التقدير بالحروف .2
function getGradeLetter(average) {
if (average >= 90) return "A";
if (average >= 80) return "B";
if (average >= 70) return "C";
if (average >= 60) return "D";
if (average >= PASS_MARK) return "E";
return "F";
}
//دالة لحساب النتيجة النهائية .3
function getFinalResult(average, attendance) {
if (average >= PASS_MARK && attendance >= MIN_ATTENDANCE) {
return "ناجح) Pass)";
} else {
return "يحتاج مراجعه (Needs Review)";
}
}
 //ربط حدث النقر بالزر .4
document.getElementById("analyzeBtn").addEventListener("click", 
function() {
    
 //قراءة النصوص الخام أوالً وحذف المسافات الزائدة 
const rawG1 = document.getElementById("grade1").value.trim();
const rawG2 = document.getElementById("grade2").value.trim();
const rawG3 = document.getElementById("grade3").value.trim();
const rawAtt = document.getElementById("attendance").value.trim();
const reportBox = document.getElementById("reportBox");

 //التحقق من عدم وجود حقول فارغة قبل أي عملية حسابية 
if (rawG1 === "" || rawG2 === "" || rawG3 === "" || rawAtt === "") {
reportBox.style.display = "block";
reportBox.innerHTML = `<p style="color: red; font-weight: 
bold;"> خطأ:الرجاء عدم ترك اي حقل فارغا وادخال جميع الدرجات.</p>`;
return;  // التنفيذ  
}

//التحويل اآلمن للنصوص إلى أرقام 
const g1 = Number(rawG1);
const g2 = Number(rawG2);
const g3 = Number(rawG3);
const att = Number(rawAtt);

 // الدرجات في مصفوفة وحساب المجموع باستخدام حلقة تكرارية //
const grades = [g1, g2, g3];
let total = 0;

for (let i = 0; i < grades.length; i++) {
total += grades[i];
}
 //حساب المتوسط واستخراج النتائج //
const average = total / grades.length;
const letter = getGradeLetter(average);
const result = getFinalResult(average, att);
عرض التقرير باستخدام قوالب النصوص .5// 
reportBox.style.display = "block"; 
reportBox.innerHTML = `
<h4>تقرير الطالب:</h4>
<p>اجمالي الدرجات:<strong>${total}</strong></p>
<p>المتوسط: <strong>${average.toFixed(1)}</strong></p>
<p>التقدير: <strong>${letter}</strong></p>
<p>الحالة: <strong>${result}</strong></p>
`;
});
</script>
</body>
</html>
